<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DemandLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Concepto: cabina de planificación. Riel de etapas a la izquierda (el ciclo S&OP), área de trabajo a la derecha, resultados siempre visibles junto a los controles. */
:root {
  --bg: #F3F5F9; --surface: #FFFFFF; --surface2: #EBEFF6; --line: #D8DFEA; --line2: #C3CCDB;
  --ink: #14213F; --ink2: #44516B; --muted: #6D7890;
  --navy: #14274E; --navy-ink: #FFFFFF;
  --teal: #12A5A0; --teal-ink: #0A736F; --teal-soft: #DDF3F1;
  --mustard: #E2A72B; --mustard-ink: #7E5800; --mustard-soft: #FBF0D5;
  --coral: #E4604A; --coral-ink: #B23B27; --coral-soft: #FBE3DE;
  --info-soft: #E3E9F6;
  --s-hist: #14274E; --s-base: #0E9690; --s-opt: #D99A12; --s-pes: #E4604A; --s-conf: #6D7890; --s-cap: #14213F;
  --grid: #E3E8F0; --shadow: 0 1px 2px rgba(20,33,63,.06), 0 6px 18px rgba(20,33,63,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1526; --surface: #15203A; --surface2: #1C2947; --line: #2A3858; --line2: #3A4A70;
  --ink: #E9EEF8; --ink2: #B2BDD3; --muted: #8592AD;
  --navy: #9DB8F2; --navy-ink: #0D1526;
  --teal: #35C4BD; --teal-ink: #5ED8D1; --teal-soft: #14363A;
  --mustard: #F0B93F; --mustard-ink: #F3C867; --mustard-soft: #3A2F14;
  --coral: #F07C67; --coral-ink: #F59A89; --coral-soft: #402320;
  --info-soft: #1F2D4F;
  --s-hist: #9DB8F2; --s-base: #35C4BD; --s-opt: #F0B93F; --s-pes: #F07C67; --s-conf: #8592AD; --s-cap: #E9EEF8;
  --grid: #263453; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1526; --surface: #15203A; --surface2: #1C2947; --line: #2A3858; --line2: #3A4A70;
  --ink: #E9EEF8; --ink2: #B2BDD3; --muted: #8592AD;
  --navy: #9DB8F2; --navy-ink: #0D1526;
  --teal: #35C4BD; --teal-ink: #5ED8D1; --teal-soft: #14363A;
  --mustard: #F0B93F; --mustard-ink: #F3C867; --mustard-soft: #3A2F14;
  --coral: #F07C67; --coral-ink: #F59A89; --coral-soft: #402320;
  --info-soft: #1F2D4F;
  --s-hist: #9DB8F2; --s-base: #35C4BD; --s-opt: #F0B93F; --s-pes: #F07C67; --s-conf: #8592AD; --s-cap: #E9EEF8;
  --grid: #263453; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 15px/1.5 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; color: var(--ink); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1440px; margin: 0 auto; }

/* barra superior */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 0 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 30; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; margin-right: auto; }
.brand h1 { font-size: 26px; font-weight: 800; }
.brand h1 b { color: var(--teal-ink); font-weight: 800; }
.brand span { color: var(--ink2); font-size: 14px; }
.biz-pill { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px; max-width: 100%; }
.biz-pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--mustard); flex: none; }
.biz-pill i.own { background: var(--teal); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line2); background: var(--surface); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--navy); color: var(--navy-ink); border-color: var(--navy); }
.btn.primary:hover { filter: brightness(1.12); background: var(--navy); }
.btn.teal { background: var(--teal-ink); color: var(--navy-ink); border-color: var(--teal-ink); }
.btn.teal:hover { filter: brightness(1.1); background: var(--teal-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn[aria-pressed="true"] { background: var(--mustard-soft); border-color: var(--mustard); color: var(--mustard-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* estructura */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 28px; padding-top: 22px; align-items: start; }
.rail { position: sticky; top: calc(var(--topH, 88px) + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; }
.rail .grp { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; font-weight: 600; }
.rail .grp:first-child { margin-top: 0; }
.nav { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; color: var(--ink2); font-weight: 500; position: relative; }
.nav:hover { background: var(--surface2); }
.nav:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; }
.nav .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--f-display); border: 1.5px solid var(--line2); color: var(--ink2); background: var(--surface); }
.nav .sub { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.nav[aria-current="page"] { background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.nav[aria-current="page"] .n { background: var(--navy); border-color: var(--navy); color: var(--navy-ink); }
.nav.tool .n { border-radius: 8px; font-size: 14px; }
.nav.tool[aria-current="page"] .n { background: var(--teal-ink); border-color: var(--teal-ink); color: var(--navy-ink); }
.nav .lbl { line-height: 1.2; }
.main { min-width: 0; }

/* contenido */
.stagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; margin-bottom: 18px; }
.stagehead .kicker { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--teal-ink); font-weight: 600; }
.stagehead h2 { font-size: 34px; line-height: 1.08; font-weight: 800; margin-top: 2px; }
.stagehead p { color: var(--ink2); max-width: 70ch; margin-top: 6px; }
.grid { display: grid; gap: 18px; min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); align-items: start; }
.split.wide { grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; box-shadow: var(--shadow); }
.card h3 { font-size: 19px; font-weight: 700; }
.card h4 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
.card .sub { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.card .hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.plain { background: none; border: none; box-shadow: none; padding: 0; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.muted { color: var(--muted); } .ink2 { color: var(--ink2); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--ink2); white-space: nowrap; }
.tag.sim { background: var(--mustard-soft); color: var(--mustard-ink); }
.tag.ok { background: var(--teal-soft); color: var(--teal-ink); }
.tag.warn { background: var(--mustard-soft); color: var(--mustard-ink); }
.tag.crit { background: var(--coral-soft); color: var(--coral-ink); }
.tag.info { background: var(--info-soft); color: var(--ink2); }

/* tarjetas de negocios */
.biz-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.bcard { all: unset; box-sizing: border-box; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); min-width: 0; transition: transform .12s, border-color .12s; }
.bcard:hover { transform: translateY(-2px); border-color: var(--teal); }
.bcard:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.bcard .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--info-soft); display: grid; place-items: center; }
.bcard h3 { font-size: 18px; font-weight: 700; }
.bcard p { color: var(--ink2); font-size: 14px; flex: 1; }
.bcard .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.bcard.own { border: 2px dashed var(--teal); background: var(--teal-soft); }
.bcard.own .ico { background: var(--teal-ink); }
.bcard.sel { border-color: var(--navy); box-shadow: 0 0 0 2px var(--navy), var(--shadow); }
.ico svg { width: 26px; height: 26px; stroke: var(--navy); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.bcard.own .ico svg { stroke: var(--navy-ink); }

/* formularios */
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > label, .lbl2 { font-size: 13px; font-weight: 600; color: var(--ink2); }
.fld .hint { font-size: 12px; color: var(--muted); }
input[type="text"], input[type="number"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-width: 0; }
input[type="number"] { font-variant-numeric: tabular-nums; }
textarea { resize: vertical; font-family: var(--f-mono); font-size: 13px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
.cell { display: flex; flex-direction: column; gap: 2px; }
.cell span { font-size: 11px; color: var(--muted); }
.cell input { padding: 6px 8px; }
.cell.miss input { border-color: var(--mustard); background: var(--mustard-soft); }
input[type="range"] { width: 100%; accent-color: var(--teal-ink); height: 26px; margin: 0; }
.sw { position: relative; width: 40px; height: 22px; flex: none; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--line2); transition: background .12s; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .12s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw input:checked + i { background: var(--teal-ink); }
.sw input:checked + i::after { transform: translateX(18px); }
.sw input:focus-visible + i { outline: 3px solid var(--teal); outline-offset: 2px; }
.ext { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); }
.ext.on { border-color: var(--teal); background: var(--teal-soft); }
.ext .top2 { display: flex; align-items: center; gap: 10px; }
.ext .top2 b { font-size: 14px; flex: 1; font-weight: 600; }
.ext .ctl { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.ext .ctl.one { grid-template-columns: 1fr; }
.ext .ctl label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
.ext .note { font-size: 12px; color: var(--ink2); }
.ext:not(.on) .ctl, .ext:not(.on) .note { opacity: .55; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .k { font-size: 12px; color: var(--ink2); font-weight: 600; }
.kpi .v { font: 700 28px/1.15 var(--f-display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi .v small { font: 500 13px var(--f-body); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi.crit { border-color: var(--coral); background: var(--coral-soft); } .kpi.crit .v { color: var(--coral-ink); }
.kpi.warn { border-color: var(--mustard); background: var(--mustard-soft); } .kpi.warn .v { color: var(--mustard-ink); }
.kpi.ok .v { color: var(--teal-ink); }

/* alertas */
.alerts { display: flex; flex-direction: column; gap: 10px; }
.alert { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.alert .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--f-display); }
.alert b { display: block; font-size: 14px; margin-bottom: 1px; }
.alert p { font-size: 14px; color: var(--ink2); }
.alert.crit { background: var(--coral-soft); border-color: var(--coral); } .alert.crit .ic { background: var(--coral-ink); }
.alert.warn { background: var(--mustard-soft); border-color: var(--mustard); } .alert.warn .ic { background: var(--mustard-ink); }
.alert.info { background: var(--info-soft); } .alert.info .ic { background: var(--ink2); }
.alert.ok { background: var(--teal-soft); border-color: var(--teal); } .alert.ok .ic { background: var(--teal-ink); }
.alert .ic { color: var(--navy-ink); }

/* tablas */
.tw { overflow-x: auto; max-width: 100%; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; font-weight: 600; color: var(--ink2); background: var(--surface2); position: sticky; top: 0; }
tr:last-child td { border-bottom: none; }
td.bad { color: var(--coral-ink); font-weight: 600; } td.good { color: var(--teal-ink); font-weight: 600; }
tr.sel td { background: var(--teal-soft); }
td input[type="number"] { width: 96px; padding: 4px 8px; text-align: right; }
.cmp td:first-child { font-weight: 600; }

/* gráficos */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: 13px; color: var(--ink2); }
.chart .legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart .legend i { width: 18px; height: 0; border-top: 3px solid; display: inline-block; border-radius: 2px; }
.chart .legend i.bar { height: 10px; width: 10px; border: 0; border-radius: 2px; }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); z-index: 5; min-width: 150px; display: none; }
.chart .tip b { display: block; margin-bottom: 3px; }
.chart .tip div { display: flex; justify-content: space-between; gap: 14px; }
.chart .tip div span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.chart .tip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.ax text { fill: var(--muted); font: 11.5px var(--f-body); }
.chart .dl { font: 600 11.5px var(--f-body); }
.tbl-toggle { font-size: 12px; }

/* varios */
.edu { display: none; background: var(--mustard-soft); border: 1px solid var(--mustard); border-radius: 12px; padding: 14px 16px; font-size: 14px; color: var(--ink); }
body.edu-on .edu { display: block; }
.edu h4 { color: var(--mustard-ink); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.edu p + p { margin-top: 6px; }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--surface2); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; margin: 6px 0; }
.callout { border-left: 4px solid var(--teal); background: var(--teal-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; font-size: 15px; }
.callout.warn { border-color: var(--mustard); background: var(--mustard-soft); }
.callout.crit { border-color: var(--coral); background: var(--coral-soft); }
ul.clean { margin: 6px 0 0; padding-left: 18px; } ul.clean li { margin: 3px 0; }
.qa { border-top: 1px solid var(--line); padding: 12px 0; } .qa:first-of-type { border-top: 0; padding-top: 0; }
.qa .q { font-weight: 600; font-size: 14px; }
.qa .a { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.qa .dc { font-size: 13px; margin-top: 4px; color: var(--teal-ink); font-weight: 500; }
.area { border-top: 5px solid var(--navy); }
.area.a1 { border-top-color: var(--mustard); } .area.a2 { border-top-color: var(--teal); } .area.a3 { border-top-color: var(--navy); } .area.a4 { border-top-color: var(--coral); }
.radio { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 12px; border: 1px solid var(--line2); border-radius: 10px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border-color: var(--teal-ink); background: var(--teal-soft); box-shadow: 0 0 0 1px var(--teal-ink); }
.opt input { margin: 3px 0 0; accent-color: var(--teal-ink); }
.opt b { font-size: 14px; } .opt span { font-size: 12.5px; color: var(--ink2); display: block; }
.ctl-row { display: grid; gap: 6px; }
.ctl-row .rtop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ctl-row .rtop label { font-size: 14px; font-weight: 600; }
.ctl-row .rin { display: grid; grid-template-columns: 1fr 100px; gap: 10px; align-items: center; }
.ctl-row .sg { font-size: 12px; color: var(--muted); }
.ctl-row .sg button { all: unset; cursor: pointer; color: var(--teal-ink); text-decoration: underline; }
.ctl-row .mod { color: var(--mustard-ink); font-weight: 600; }
.compare { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.cmpc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.cmpc .k { font-size: 12px; font-weight: 600; color: var(--ink2); }
.cmpc .bar { display: grid; grid-template-columns: 74px 1fr 82px; align-items: center; gap: 8px; margin-top: 8px; font-size: 12.5px; }
.cmpc .bar .tr { height: 12px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.cmpc .bar .tr i { display: block; height: 100%; border-radius: 4px; }
.cmpc .bar span:last-child { text-align: right; font-weight: 600; }
.cmpc .dl2 { margin-top: 8px; font-size: 13px; font-weight: 600; }

/* ---------- utilidades de formulario ---------- */
function getPath(o, p) { return p.split('.').reduce(function (a, k) { return a === null || a === undefined ? a : a[k]; }, o); }
function setPath(o, p, v) { var ks = p.split('.'), last = ks.pop(), t = ks.reduce(function (a, k) { return a[k]; }, o); t[last] = v; }
function nval(v) { if (v === '' || v === null || v === undefined) return null; var n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : null; }
function fv(v) { return v === null || v === undefined ? '' : String(v); }
function fld(label, key, o) {
  o = o || {}; var v = getPath(S.biz, key), id = 'f-' + key.replace(/\./g, '-');
  var h = '<div class="fld"><label for="' + id + '">' + label + '</label>';
  if (o.sel) h += '<select id="' + id + '" data-k="' + key + '" data-t="s">' + o.sel.map(function (x) { return '<option value="' + x[0] + '"' + (String(v) === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>';
  else if (o.text) h += '<input type="text" id="' + id + '" data-k="' + key + '" data-t="s" value="' + esc(fv(v)) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
  else h += '<input type="number" inputmode="decimal" id="' + id + '" data-k="' + key + '" data-t="n" step="' + (o.step || 'any') + '"' + (o.min !== undefined ? ' min="' + o.min + '"' : '') + (o.max !== undefined ? ' max="' + o.max + '"' : '') + ' value="' + esc(fv(v)) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>';
  if (o.hint) h += '<span class="hint">' + o.hint + '</span>';
  return h + '</div>';
}
function eduBox(title, html) { return '<div class="edu"><h4>' + title + '</h4>' + html + '</div>'; }
function stageHead(num, kicker, title, text, right) {
  return '<div class="stagehead"><div><div class="kicker">' + (num ? 'Etapa ' + num + ' · ' : '') + kicker + '</div><h2>' + title + '</h2><p>' + text + '</p></div>' + (right || '') + '</div>';
}

/* ---------- eventos delegados ---------- */
var ACT = {};
function initEvents() {
  var main = $('#main');
  document.body.addEventListener('input', function (e) {
    var el = e.target; if (!el.dataset || !el.dataset.k) return;
    var k = el.dataset.k, t = el.dataset.t, v;
    if (t === 'b') v = el.checked; else if (t === 's') v = el.type === 'text' ? el.value.replace(/[<>]/g, '') : el.value; else v = nval(el.value);
    if (el.dataset.int && v !== null) v = Math.round(v);
    if (el.dataset.scale && v !== null) v = v / Number(el.dataset.scale);
    setPath(S.biz, k, v);
    $$('[data-k="' + k + '"]').forEach(function (o) { if (o !== el && (o.type === 'range' || o.type === 'number')) o.value = fv(el.dataset.scale && v !== null ? v * Number(el.dataset.scale) : v); });
    if (el.dataset.remount) { save(); remount(); return; }
    touch();
  });
  document.body.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var a = el.dataset.act; if (ACT[a]) ACT[a](el, e);
  });
}

/* ---------- ETAPA 1 · DATOS ---------- */
function parseSeries(text) {
  var lines = text.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean), out = [];
  var tok = function (s) { var n = Number(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) && /\d/.test(s) ? n : null; };
  if (lines.length === 1) { lines[0].split(/[;,\t]+|\s+/).forEach(function (x) { var n = tok(x); if (n !== null) out.push(n); }); return out; }
  lines.forEach(function (l) { var m = l.match(/-?\d+(?:[.,]\d+)?/g); if (m) { var last = m[m.length - 1]; if (/[A-Za-z]/.test(l) && m.length === 1 && /^\D*\d+\D+/.test(l) && !/^\s*-?\d/.test(l) && false) return; out.push(Number(last.replace(',', '.'))); } });
  return out;
}
ACT.csvapply = function () { var t = $('#csvtxt').value, arr = parseSeries(t); if (arr.length < 1) { toast('No se encontraron números. Pega una columna (un valor por línea) o una fila separada por comas.'); return; } arr = arr.slice(-DL.MAXN); S.biz.history = arr; _mk = null; remount(); touch(); toast('Historial importado: ' + arr.length + ' períodos.'); };
